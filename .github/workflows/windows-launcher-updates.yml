name: Windows launcher updates
on:
  push:
    branches: [terrain-height-maps]
  workflow_dispatch:
concurrency:
  group: windows-launcher-channel
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  publish:
    if: github.ref_name == 'terrain-height-maps'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build enhanced textures
        run: |
          python -m pip install Pillow==11.3.0 numpy==2.2.6
          python tools/upgrade_surfaces.py desktop
      - name: Import and test the game
        env:
          FOH_SURFACE_PROFILE: desktop
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import
          timeout 90 Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/surface_upgrade.gd
          timeout 90 Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/main_menu_navigation.gd
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/windows_launcher_updates.gd
          timeout 90 Godot_v4.7.2-stable_linux.x86_64 --headless --path . --max-fps 90 --script res://tests/detail_walk_stream.gd
          timeout 90 Godot_v4.7.2-stable_linux.x86_64 --headless --path . --max-fps 90 --script res://tests/detail_camera_coverage.gd
          timeout 90 Godot_v4.7.2-stable_linux.x86_64 --headless --path . --max-fps 90 --script res://tests/detail_surface_appearance.gd
          timeout 90 Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/detail_relief.gd
          timeout 90 Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/map_building_models.gd
      - name: Publish game data and advance the Windows channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          godot_bin=Godot_v4.7.2-stable_linux.x86_64
          bundle="$RUNNER_TEMP/windows-content"
          mkdir -p "$bundle"
          base_tag=windows-launcher-base-v1
          update_tag="windows-launcher-update-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
          release_root="https://github.com/$GITHUB_REPOSITORY/releases/download"
          patch=null
          deltas='[]'
          channel=refs/heads/windows-launcher-channel
          parent=()
          recent_revisions=()
          if git ls-remote --exit-code --heads origin "$channel" >/dev/null; then
            git fetch --depth=2 origin "$channel"
            if previous=$(git show FETCH_HEAD:manifest.json | jq -er '.revision'); then
              if (( previous > GITHUB_RUN_NUMBER )); then exit 0; fi
            fi
            parent=(-p FETCH_HEAD)
            mapfile -t recent_revisions < <(git log -2 --format=%H FETCH_HEAD)
          fi
          if gh release view "$base_tag" --json tagName >/dev/null 2>&1; then
            gh release download "$base_tag" --pattern windows-base.pck --dir "$bundle"
            "$godot_bin" --headless --path . --export-patch "Windows Desktop" "$bundle/windows-patch.pck" --patches "$bundle/windows-base.pck"
            test -s "$bundle/windows-patch.pck"
            test "$(stat -c%s "$bundle/windows-patch.pck")" -le 1610612736
            base_hash=$(sha256sum "$bundle/windows-base.pck" | cut -d' ' -f1)
            previous_tags=()
            for revision in "${recent_revisions[@]}"; do
              previous_patch=$(git show "$revision:manifest.json" | jq -c --arg base "$base_hash" 'select(.base.sha256 == $base) | .patch // empty')
              if [[ -z "$previous_patch" ]]; then continue; fi
              url=$(jq -er '.url' <<<"$previous_patch")
              if [[ "$url" != "$release_root/"* ]]; then continue; fi
              suffix=${url#"$release_root/"}
              if [[ ! "$suffix" =~ ^windows-launcher-update-([0-9]+-[0-9]+)/windows-patch\.pck$ ]]; then continue; fi
              version=${BASH_REMATCH[1]}
              tag="windows-launcher-update-$version"
              if [[ "$tag" == "$update_tag" || " ${previous_tags[*]} " == *" $tag "* ]]; then continue; fi
              previous_tags+=("$tag")
              earlier="$bundle/previous.pck"
              delta="$bundle/windows-delta-$version.bin"
              if gh release download "$tag" --pattern windows-patch.pck --output "$earlier" &&
                [[ $(stat -c%s "$earlier") == "$(jq -r '.size' <<<"$previous_patch")" ]] &&
                [[ $(sha256sum "$earlier" | cut -d' ' -f1) == "$(jq -r '.sha256' <<<"$previous_patch")" ]] &&
                python tools/windows_pack_delta.py "$earlier" "$bundle/windows-patch.pck" "$delta"; then
                if [[ -s "$delta" ]]; then
                  deltas=$(jq -c --argjson old "$previous_patch" --arg url "$release_root/$update_tag/${delta##*/}" \
                    --arg sha "$(sha256sum "$delta" | cut -d' ' -f1)" --argjson size "$(stat -c%s "$delta")" \
                    '. + [{url:$url,sha256:$sha,size:$size,from:$old}]' <<<"$deltas")
                fi
              else
                rm -f "$delta"
                echo "::warning::Unable to build a Windows delta from $tag"
              fi
              rm -f "$earlier"
            done
            shopt -s nullglob
            gh release create "$update_tag" "$bundle/windows-patch.pck" "$bundle"/windows-delta-*.bin --target "$GITHUB_SHA" --prerelease --latest=false --title "Windows update $GITHUB_RUN_NUMBER" --notes "Windows launcher content for $GITHUB_SHA."
            patch=$(jq -n --arg url "$release_root/$update_tag/windows-patch.pck" --arg sha "$(sha256sum "$bundle/windows-patch.pck" | cut -d' ' -f1)" --argjson size "$(stat -c%s "$bundle/windows-patch.pck")" '{url:$url,sha256:$sha,size:$size}')
          else
            "$godot_bin" --headless --path . --export-pack "Windows Desktop" "$bundle/windows-base.pck"
            test -s "$bundle/windows-base.pck"
            gh release create "$base_tag" "$bundle/windows-base.pck" --target "$GITHUB_SHA" --prerelease --latest=false --title "Windows launcher game data" --notes "Initial game pack for the Windows launcher."
          fi
          jq -n --argjson revision "$GITHUB_RUN_NUMBER" --arg source "$GITHUB_SHA" --arg url "$release_root/$base_tag/windows-base.pck" --arg sha "$(sha256sum "$bundle/windows-base.pck" | cut -d' ' -f1)" --argjson size "$(stat -c%s "$bundle/windows-base.pck")" --argjson patch "$patch" --argjson deltas "$deltas" '{schema:1,runtime:"godot-4.7.2-windows-v1",revision:$revision,source:$source,base:{url:$url,sha256:$sha,size:$size},patch:$patch,deltas:$deltas}' > "$bundle/manifest.json"

          blob=$(git hash-object -w "$bundle/manifest.json")
          tree=$(printf '100644 blob %s\tmanifest.json\n' "$blob" | git mktree)
          commit=$(git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit-tree "$tree" "${parent[@]}" -m "Publish Windows game revision $GITHUB_RUN_NUMBER")
          git push origin "$commit:$channel"
