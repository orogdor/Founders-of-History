name: Android launcher updates
on:
  push:
    branches: [terrain-height-maps]
  workflow_dispatch:
concurrency:
  group: android-launcher-channel
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: github.ref_name == 'terrain-height-maps'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import and test the game
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/launcher_updates.gd
      - name: Publish game data and advance the Android channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          godot_bin=Godot_v4.7.2-stable_linux.x86_64
          bundle="$RUNNER_TEMP/android-content"
          mkdir -p "$bundle"
          base_tag=android-launcher-base-v1
          update_tag="android-launcher-update-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
          release_root="https://github.com/$GITHUB_REPOSITORY/releases/download"
          patch=null
          if gh release view "$base_tag" --json tagName >/dev/null 2>&1; then
            gh release download "$base_tag" --pattern android-base.pck --dir "$bundle"
            "$godot_bin" --headless --path . --export-patch Android "$bundle/android-patch.pck" --patches "$bundle/android-base.pck"
            test -s "$bundle/android-patch.pck"
            gh release create "$update_tag" "$bundle/android-patch.pck" --target "$GITHUB_SHA" --prerelease --latest=false --title "Android update $GITHUB_RUN_NUMBER" --notes "Android launcher content for $GITHUB_SHA."
            patch=$(jq -n --arg url "$release_root/$update_tag/android-patch.pck" --arg sha "$(sha256sum "$bundle/android-patch.pck" | cut -d' ' -f1)" --argjson size "$(stat -c%s "$bundle/android-patch.pck")" '{url:$url,sha256:$sha,size:$size}')
          else
            "$godot_bin" --headless --path . --export-pack Android "$bundle/android-base.pck"
            test -s "$bundle/android-base.pck"
            gh release create "$base_tag" "$bundle/android-base.pck" --target "$GITHUB_SHA" --prerelease --latest=false --title "Android launcher game data" --notes "Initial game pack for the Android launcher."
          fi
          jq -n --argjson revision "$GITHUB_RUN_NUMBER" --arg source "$GITHUB_SHA" --arg url "$release_root/$base_tag/android-base.pck" --arg sha "$(sha256sum "$bundle/android-base.pck" | cut -d' ' -f1)" --argjson size "$(stat -c%s "$bundle/android-base.pck")" --argjson patch "$patch" '{schema:1,runtime:"godot-4.7.2-android-v1",revision:$revision,source:$source,base:{url:$url,sha256:$sha,size:$size},patch:$patch}' > "$bundle/manifest.json"

          channel=refs/heads/android-launcher-channel
          parent=()
          if git ls-remote --exit-code --heads origin "$channel" >/dev/null; then
            git fetch --depth=1 origin "$channel"
            if previous=$(git show FETCH_HEAD:manifest.json | jq -er '.revision'); then
              if (( previous > GITHUB_RUN_NUMBER )); then exit 0; fi
            fi
            parent=(-p FETCH_HEAD)
          fi
          blob=$(git hash-object -w "$bundle/manifest.json")
          tree=$(printf '100644 blob %s\tmanifest.json\n' "$blob" | git mktree)
          commit=$(git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit-tree "$tree" "${parent[@]}" -m "Publish Android game revision $GITHUB_RUN_NUMBER")
          git push origin "$commit:$channel"
