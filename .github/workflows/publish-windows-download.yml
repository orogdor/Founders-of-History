name: Publish Windows download
on:
  push:
    branches: [publish-windows-update-38]
    paths: ['.github/workflows/publish-windows-download.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d7a70f7f85c5fefb5bbdd0f41bef996e718b67f1
          fetch-depth: 1
      - name: Download verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch 46061408109 --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status
          gh run download 46061408109 --repo "$GITHUB_REPOSITORY" --name Founders-of-History-Windows --dir /tmp/game
          find /tmp/game -maxdepth 3 -type f -printf '%P %s\n'
          cd /tmp/game
          zip -q -r /tmp/Founders-of-History-Windows.zip .
          unzip -tq /tmp/Founders-of-History-Windows.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create windows-jahionn-puud-20261127 /tmp/Founders-of-History-Windows.zip --repo "$GITHUB_REPOSITORY" --target d7a70f7f85c5fefb5bbdd0f41bef996e718b67f1 --title "Founders of History Windows" --notes "Parandatud jahionni seinad ja külavaate puud." --latest=false
