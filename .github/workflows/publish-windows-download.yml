name: Publish Windows download
on:
  push:
    branches: [publish-windows-update-38]
    paths: ['.github/workflows/publish-windows-download.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch 46064731008 --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status
          gh run download 46064731008 --repo "$GITHUB_REPOSITORY" --name Founders-of-History-Windows --dir /tmp/game
          find /tmp/game -maxdepth 3 -type f -printf '%P %s\n'
          cd /tmp/game
          zip -q -r /tmp/Founders-of-History-Windows.zip .
          unzip -tq /tmp/Founders-of-History-Windows.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create windows-puitvallid-20261127 /tmp/Founders-of-History-Windows.zip --repo "$GITHUB_REPOSITORY" --target 94ab759ecbf39cc74daf7f9590b3f360234b8c50 --title "Founders of History Windows" --notes "Jahionni punutis räästani, uued maailmakaardi elamud ning ehitatavad puitvallid ja vahitornid." --latest=false
