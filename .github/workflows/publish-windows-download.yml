name: Publish Windows download
on:
  push:
    branches: [publish-windows-update-38]
    paths: ['.github/workflows/publish-windows-download.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch 46069637957 --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status
          gh run download 46069637957 --repo "$GITHUB_REPOSITORY" --name Founders-of-History-Windows --dir /tmp/game
          find /tmp/game -maxdepth 3 -type f -printf '%P %s\n'
          cd /tmp/game
          zip -q -r /tmp/Founders-of-History-Windows.zip .
          unzip -tq /tmp/Founders-of-History-Windows.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create windows-maailmakaart-20261127 /tmp/Founders-of-History-Windows.zip --repo "$GITHUB_REPOSITORY" --target 50de7815b73e8ca9fd0ffd2b61122e69a24b5175 --title "Founders of History Windows" --notes "Maailmakaardi jõudlus: linnad töötavad kordamööda, tühjad linnaosad on kergemad ning kaardi avastamine kasutab olemasolevaid linnapiire." --latest=false
